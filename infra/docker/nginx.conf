server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin from the browser's point of view: nginx forwards to the gateway container, so there
    # is no cross-origin request (and no CORS) between the app and its API at all when served this way.
    location /api/ {
        proxy_pass http://api-gateway:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular routing: any unmatched path falls back to index.html so client-side routes work on a
    # hard refresh or a deep link, not just when navigated to from within the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
