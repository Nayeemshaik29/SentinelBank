name: sentinelbank

# Local development infrastructure. Credentials below are throwaway dev defaults.
# Override any of them with a .env file next to this one (never commit real secrets).

services:
  postgres:
    image: postgres:17-alpine
    container_name: sentinelbank-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinelbank}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
    ports:
      # Host port 5433 (not 5432) so it never clashes with a Postgres already installed on your machine.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:8
    container_name: sentinelbank-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.0.0
    container_name: sentinelbank-kafka
    ports:
      - "9092:9092"
    environment:
      # Single node, KRaft mode (no ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT (9092) is for apps on your machine, INTERNAL (19092) is for other containers.
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  # One-shot job: creates the topics, then exits.
  kafka-init:
    image: apache/kafka:4.0.0
    container_name: sentinelbank-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    environment:
      BOOTSTRAP: kafka:19092
    entrypoint: ["/bin/bash", "/init/create-topics.sh"]
    volumes:
      - ./kafka/create-topics.sh:/init/create-topics.sh:ro

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: sentinelbank-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI: http://localhost:8025

  # --- Application services -------------------------------------------------------------------------
  # Everything below is optional: the infra above is enough for the per-service `mvnw spring-boot:run`
  # workflow the README also documents. This is the "one-command" path instead — `docker compose up`
  # from a clean clone builds all 9 Spring Boot services plus the Angular app and runs the whole system.
  # Every JVM service is the same image built from ../infra/docker/service.Dockerfile with a different
  # MODULE build arg; only the environment each one needs differs (compare against its own
  # src/main/resources/application.yaml — these are exactly that file's ${VAR:default} placeholders,
  # pointed at other containers by service name instead of localhost).

  auth-service:
    build:
      context: ..
      dockerfile: infra/docker/service.Dockerfile
      args:
        MODULE: services/auth-service
    container_name: sentinelbank-auth-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-sentinelbank}
      DB_USER: ${POSTGRES_USER:-sentinel}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret-change-me}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
      SEED_PASSWORD: ${SEED_PASSWORD:-Demo#12345}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  account-service:
    build:
      context: ..
      dockerfile: infra/docker/service.Dockerfile
      args:
        MODULE: services/account-service
    container_name: sentinelbank-account-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-sentinelbank}
      DB_USER: ${POSTGRES_USER:-sentinel}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      SEED_DEMO_ACCOUNTS: ${SEED_DEMO_ACCOUNTS:-true}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  transaction-service:
    build:
      context: ..
      dockerfile: infra/docker/service.Dockerfile
      args:
        MODULE: services/transaction-service
    container_name: sentinelbank-transaction-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-sentinelbank}
      DB_USER: ${POSTGRES_USER:-sentinel}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ACCOUNT_SERVICE_URL: http://account-service:8082
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      account-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  partner-bank-service:
    build:
      context: ..
      dockerfile: infra/docker/service.Dockerfile
      args:
        MODULE: services/partner-bank-service
    container_name: sentinelbank-partner-bank-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-sentinelbank}
      DB_USER: ${POSTGRES_USER:-sentinel}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  fraud-service:
    build:
      context: ..
      dockerfile: infra/docker/service.Dockerfile
      args:
        MODULE: services/fraud-service
    container_name: sentinelbank-fraud-service
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "8085:8085"
    depends_on:
      mongo:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  notification-service:
    build:
      context: ..
      dockerfile: infra/docker/service.Dockerfile
      args:
        MODULE: services/notification-service
    container_name: sentinelbank-notification-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-sentinelbank}
      DB_USER: ${POSTGRES_USER:-sentinel}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      MAILHOG_HOST: mailhog
      MAILHOG_PORT: 1025
      ACCOUNT_SERVICE_URL: http://account-service:8082
      AUTH_SERVICE_URL: http://auth-service:8081
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      account-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  audit-service:
    build:
      context: ..
      dockerfile: infra/docker/service.Dockerfile
      args:
        MODULE: services/audit-service
    container_name: sentinelbank-audit-service
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "8087:8087"
    depends_on:
      mongo:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ai-agent-service:
    build:
      context: ..
      dockerfile: infra/docker/service.Dockerfile
      args:
        MODULE: services/ai-agent-service
    container_name: sentinelbank-ai-agent-service
    environment:
      ACCOUNT_SERVICE_URL: http://account-service:8082
      TRANSACTION_SERVICE_URL: http://transaction-service:8083
      # Ollama itself is NOT containerized here (a multi-GB model image is a lot to ask of a demo compose
      # file) — it's expected to already be running on your machine, and Docker Desktop's own DNS name
      # for that is host.docker.internal. If Ollama isn't running at all, this service still starts fine
      # and the /ai/ask endpoint degrades to its honest "temporarily unavailable" fallback (see the
      # "Spending assistant" section below) rather than failing to boot.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "8088:8088"
    depends_on:
      account-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api-gateway:
    build:
      context: ..
      dockerfile: infra/docker/service.Dockerfile
      args:
        MODULE: services/api-gateway
    container_name: sentinelbank-api-gateway
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret-change-me}
      AUTH_SERVICE_URL: http://auth-service:8081
      ACCOUNT_SERVICE_URL: http://account-service:8082
      TRANSACTION_SERVICE_URL: http://transaction-service:8083
      FRAUD_SERVICE_URL: http://fraud-service:8085
      AUDIT_SERVICE_URL: http://audit-service:8087
      AI_AGENT_SERVICE_URL: http://ai-agent-service:8088
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
      fraud-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      ai-agent-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: sentinelbank-frontend
    ports:
      - "4200:80"
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  postgres-data:
  mongo-data:
  kafka-data:
