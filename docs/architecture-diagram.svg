<svg width="100%" viewBox="0 0 1720 950" xmlns="http://www.w3.org/2000/svg" role="img">
<title>SentinelBank architecture</title>
<desc>Clients through the API gateway into a private subnet of nine Spring Boot services, PostgreSQL, MongoDB and Ollama, Docker Compose deployment, and Kafka on the right.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
  text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #2C2C2A; }
  .title { font-size: 20px; font-weight: 700; fill: #185FA5; }
  .subtitle { font-size: 13px; fill: #5F5E5A; }
  .sectionLabel { font-size: 13px; font-weight: 700; fill: #5F5E5A; }
  .boxTitle { font-size: 13px; font-weight: 700; }
  .boxSub { font-size: 10.5px; }
  .box { rx: 8; stroke-width: 1.3; }
  .blue    { fill: #E6F1FB; stroke: #185FA5; } .blueText { fill: #0C447C; }
  .purple  { fill: #EEEDFE; stroke: #534AB7; } .purpleText { fill: #3C3489; }
  .teal    { fill: #E1F5EE; stroke: #0F6E56; } .tealText { fill: #085041; }
  .amber   { fill: #FAEEDA; stroke: #BA7517; } .amberText { fill: #854F0B; }
  .coral   { fill: #FAECE7; stroke: #993C1D; } .coralText { fill: #712B13; }
  .green   { fill: #EAF3DE; stroke: #3B6D11; } .greenText { fill: #27500A; }
  .gray    { fill: #F1EFE8; stroke: #888780; } .grayText { fill: #444441; }
  .pink    { fill: #FBEAF0; stroke: #993556; } .pinkText { fill: #72243E; }
  .subnet  { fill: none; stroke: #888780; stroke-width: 1.3; stroke-dasharray: 6 4; }
  .conn    { fill: none; stroke: #5F5E5A; stroke-width: 1.3; }
</style>
</defs>

<rect x="0" y="0" width="1720" height="950" fill="#FFFFFF"/>

<text x="20" y="34" class="title">SentinelBank — Banking Microservices Architecture</text>
<text x="20" y="54" class="subtitle">Spring Boot 4 + Kafka + Angular + Spring AI, deployed with Docker Compose</text>

<!-- Clients -->
<text x="20" y="92" class="sectionLabel">Clients</text>
<g class="box blue"><rect x="20" y="105" width="190" height="62" rx="8"/></g>
<text x="115" y="130" text-anchor="middle" class="boxTitle blueText">Customer App</text>
<text x="115" y="148" text-anchor="middle" class="boxSub blueText">Angular</text>

<g class="box blue"><rect x="20" y="180" width="190" height="62" rx="8"/></g>
<text x="115" y="205" text-anchor="middle" class="boxTitle blueText">Analyst Dashboard</text>
<text x="115" y="223" text-anchor="middle" class="boxSub blueText">Angular, role-guarded</text>

<g class="box blue"><rect x="20" y="255" width="190" height="62" rx="8"/></g>
<text x="115" y="280" text-anchor="middle" class="boxTitle blueText">API Testing</text>
<text x="115" y="298" text-anchor="middle" class="boxSub blueText">Postman</text>

<g class="box blue"><rect x="20" y="330" width="190" height="62" rx="8"/></g>
<text x="115" y="355" text-anchor="middle" class="boxTitle blueText">External Partners</text>
<text x="115" y="373" text-anchor="middle" class="boxSub blueText">Mock systems</text>

<!-- Gateway -->
<g class="box purple"><rect x="255" y="180" width="190" height="220" rx="8"/></g>
<text x="350" y="215" text-anchor="middle" class="boxTitle purpleText" font-size="15">API Gateway</text>
<text x="350" y="245" text-anchor="middle" class="boxSub purpleText">Routing</text>
<text x="350" y="266" text-anchor="middle" class="boxSub purpleText">JWT validation</text>
<text x="350" y="287" text-anchor="middle" class="boxSub purpleText">Rate limiting</text>
<text x="350" y="308" text-anchor="middle" class="boxSub purpleText">Correlation ID</text>
<text x="350" y="329" text-anchor="middle" class="boxSub purpleText">CORS</text>

<path d="M210 235 L255 235" class="conn" marker-end="url(#arrow)"/>
<text x="232" y="227" text-anchor="middle" class="boxSub" font-size="9">HTTPS</text>

<!-- Private subnet boundary -->
<rect x="480" y="20" width="890" height="830" class="box subnet"/>
<text x="500" y="45" class="sectionLabel" fill="#5F5E5A">Private Subnet</text>

<path d="M445 290 L480 290" class="conn" marker-end="url(#arrow)"/>

<!-- Cross-cutting row -->
<text x="500" y="80" class="sectionLabel" fill="#854F0B">Cross-cutting</text>
<g class="box amber"><rect x="500" y="90" width="200" height="70" rx="8"/></g>
<text x="600" y="115" text-anchor="middle" class="boxTitle amberText">Correlation ID</text>
<text x="600" y="133" text-anchor="middle" class="boxSub amberText">gateway to every log line</text>

<g class="box amber"><rect x="712" y="90" width="200" height="70" rx="8"/></g>
<text x="812" y="115" text-anchor="middle" class="boxTitle amberText">Logging</text>
<text x="812" y="133" text-anchor="middle" class="boxSub amberText">structured JSON, MDC</text>

<g class="box amber"><rect x="924" y="90" width="200" height="70" rx="8"/></g>
<text x="1024" y="115" text-anchor="middle" class="boxTitle amberText">Config</text>
<text x="1024" y="133" text-anchor="middle" class="boxSub amberText">application.yaml + env vars</text>

<g class="box amber"><rect x="1136" y="90" width="200" height="70" rx="8"/></g>
<text x="1236" y="115" text-anchor="middle" class="boxTitle amberText">Resilience4j</text>
<text x="1236" y="133" text-anchor="middle" class="boxSub amberText">circuit breaker, retry</text>

<!-- Business services grid -->
<text x="500" y="196" class="sectionLabel" fill="#085041">Business services</text>

<g class="box teal"><rect x="500" y="206" width="200" height="92" rx="8"/></g>
<text x="600" y="228" text-anchor="middle" class="boxTitle tealText">Auth Service</text>
<text x="600" y="246" text-anchor="middle" class="boxSub tealText">Login, JWT, roles</text>
<text x="600" y="262" text-anchor="middle" class="boxSub tealText">Refresh tokens, KYC</text>
<text x="600" y="285" text-anchor="middle" class="boxSub" font-size="9.5" fill="#5F5E5A">PostgreSQL · auth</text>

<g class="box teal"><rect x="712" y="206" width="200" height="92" rx="8"/></g>
<text x="812" y="228" text-anchor="middle" class="boxTitle tealText">Account Service</text>
<text x="812" y="246" text-anchor="middle" class="boxSub tealText">Balances, ledger</text>
<text x="812" y="262" text-anchor="middle" class="boxSub tealText">@Version optimistic lock</text>
<text x="812" y="285" text-anchor="middle" class="boxSub" font-size="9.5" fill="#5F5E5A">PostgreSQL · account</text>

<g class="box teal"><rect x="924" y="206" width="200" height="92" rx="8"/></g>
<text x="1024" y="228" text-anchor="middle" class="boxTitle tealText">Transaction Service</text>
<text x="1024" y="246" text-anchor="middle" class="boxSub tealText">Idempotency, saga state</text>
<text x="1024" y="262" text-anchor="middle" class="boxSub tealText">Transactional outbox</text>
<text x="1024" y="285" text-anchor="middle" class="boxSub" font-size="9.5" fill="#5F5E5A">PostgreSQL · transaction</text>

<g class="box teal"><rect x="1136" y="206" width="200" height="92" rx="8"/></g>
<text x="1236" y="228" text-anchor="middle" class="boxTitle tealText">Partner Bank</text>
<text x="1236" y="246" text-anchor="middle" class="boxSub tealText">Mock credit side</text>
<text x="1236" y="262" text-anchor="middle" class="boxSub tealText">Saga step, compensation</text>
<text x="1236" y="285" text-anchor="middle" class="boxSub" font-size="9.5" fill="#5F5E5A">PostgreSQL · partner_bank</text>

<g class="box teal"><rect x="500" y="312" width="200" height="92" rx="8"/></g>
<text x="600" y="334" text-anchor="middle" class="boxTitle tealText">Fraud Service</text>
<text x="600" y="352" text-anchor="middle" class="boxSub tealText">Rules engine</text>
<text x="600" y="368" text-anchor="middle" class="boxSub tealText">Cases for analysts</text>
<text x="600" y="391" text-anchor="middle" class="boxSub" font-size="9.5" fill="#5F5E5A">MongoDB · fraud</text>

<g class="box teal"><rect x="712" y="312" width="200" height="92" rx="8"/></g>
<text x="812" y="334" text-anchor="middle" class="boxTitle tealText">Notification Service</text>
<text x="812" y="352" text-anchor="middle" class="boxSub tealText">Email / SMS</text>
<text x="812" y="368" text-anchor="middle" class="boxSub tealText">Retry topic</text>
<text x="812" y="391" text-anchor="middle" class="boxSub" font-size="9.5" fill="#5F5E5A">PostgreSQL · notification</text>

<g class="box teal"><rect x="924" y="312" width="200" height="92" rx="8"/></g>
<text x="1024" y="334" text-anchor="middle" class="boxTitle tealText">Audit Service</text>
<text x="1024" y="352" text-anchor="middle" class="boxSub tealText">Append-only trail</text>
<text x="1024" y="368" text-anchor="middle" class="boxSub tealText">Feeds compliance</text>
<text x="1024" y="391" text-anchor="middle" class="boxSub" font-size="9.5" fill="#5F5E5A">MongoDB · audit</text>

<g class="box teal"><rect x="1136" y="312" width="200" height="92" rx="8"/></g>
<text x="1236" y="334" text-anchor="middle" class="boxTitle tealText">AI Agent Service</text>
<text x="1236" y="352" text-anchor="middle" class="boxSub tealText">Read-only advice</text>
<text x="1236" y="368" text-anchor="middle" class="boxSub tealText">PII masked, validated</text>
<text x="1236" y="391" text-anchor="middle" class="boxSub" font-size="9.5" fill="#5F5E5A">Spring AI · Ollama</text>

<!-- Event streaming -->
<text x="500" y="436" class="sectionLabel" fill="#712B13">Event streaming / async</text>
<g class="box coral"><rect x="500" y="446" width="412" height="78" rx="8"/></g>
<text x="706" y="472" text-anchor="middle" class="boxTitle coralText">Outbox Publisher</text>
<text x="706" y="492" text-anchor="middle" class="boxSub coralText">Polls unpublished rows, publishes keyed by accountId</text>

<g class="box coral"><rect x="924" y="446" width="412" height="78" rx="8"/></g>
<text x="1130" y="472" text-anchor="middle" class="boxTitle coralText">Idempotent Consumers</text>
<text x="1130" y="492" text-anchor="middle" class="boxSub coralText">Skips processed events; retry topic, then DLT</text>

<!-- Data stores -->
<text x="500" y="558" class="sectionLabel" fill="#27500A">Data stores</text>
<g class="box green"><rect x="500" y="568" width="270" height="76" rx="8"/></g>
<text x="635" y="593" text-anchor="middle" class="boxTitle greenText">PostgreSQL</text>
<text x="635" y="611" text-anchor="middle" class="boxSub greenText">One schema per service</text>
<text x="635" y="627" text-anchor="middle" class="boxSub greenText">Accounts, ledger, outbox</text>

<g class="box green"><rect x="791" y="568" width="270" height="76" rx="8"/></g>
<text x="926" y="593" text-anchor="middle" class="boxTitle greenText">MongoDB</text>
<text x="926" y="611" text-anchor="middle" class="boxSub greenText">Fraud cases</text>
<text x="926" y="627" text-anchor="middle" class="boxSub greenText">Audit events</text>

<g class="box green"><rect x="1082" y="568" width="254" height="76" rx="8"/></g>
<text x="1209" y="593" text-anchor="middle" class="boxTitle greenText">Ollama (local LLM)</text>
<text x="1209" y="611" text-anchor="middle" class="boxSub greenText">Advice only, PII masked</text>
<text x="1209" y="627" text-anchor="middle" class="boxSub greenText">No write tools</text>

<!-- Deployment -->
<text x="500" y="680" class="sectionLabel" fill="#444441">Deployment — Docker Compose</text>
<g class="box gray"><rect x="500" y="690" width="163" height="66" rx="8"/></g>
<text x="581" y="715" text-anchor="middle" class="boxTitle grayText">Containers</text>
<text x="581" y="732" text-anchor="middle" class="boxSub grayText">9 services + infra</text>

<g class="box gray"><rect x="674" y="690" width="163" height="66" rx="8"/></g>
<text x="755" y="715" text-anchor="middle" class="boxTitle grayText">Networking</text>
<text x="755" y="732" text-anchor="middle" class="boxSub grayText">Bridge network</text>

<g class="box gray"><rect x="848" y="690" width="163" height="66" rx="8"/></g>
<text x="929" y="715" text-anchor="middle" class="boxTitle grayText">Volumes</text>
<text x="929" y="732" text-anchor="middle" class="boxSub grayText">Postgres, Mongo, Kafka</text>

<g class="box gray"><rect x="1022" y="690" width="163" height="66" rx="8"/></g>
<text x="1103" y="715" text-anchor="middle" class="boxTitle grayText">Health checks</text>
<text x="1103" y="732" text-anchor="middle" class="boxSub grayText">Actuator per service</text>

<g class="box gray"><rect x="1196" y="690" width="140" height="66" rx="8"/></g>
<text x="1266" y="715" text-anchor="middle" class="boxTitle grayText">Ports</text>
<text x="1266" y="732" text-anchor="middle" class="boxSub grayText">8080–8088</text>

<text x="500" y="800" class="boxSub" fill="#888780" font-size="11">Kubernetes manifests: planned, if time allows.</text>

<!-- Kafka column -->
<path d="M1370 280 L1400 280" class="conn" marker-end="url(#arrow)"/>
<path d="M1400 300 L1370 300" class="conn" marker-end="url(#arrow)"/>
<g class="box pink"><rect x="1400" y="90" width="290" height="700" rx="10"/></g>
<text x="1545" y="122" text-anchor="middle" class="boxTitle pinkText" font-size="16">Kafka</text>
<text x="1545" y="140" text-anchor="middle" class="boxSub pinkText">KRaft mode, 3 partitions/topic</text>

<line x1="1420" y1="156" x2="1670" y2="156" stroke="#993556" stroke-width="0.7" opacity="0.4"/>

<text x="1420" y="182" class="boxTitle pinkText" font-size="12">Topics</text>
<text x="1420" y="202" class="boxSub pinkText">transfer.initiated</text>
<text x="1420" y="220" class="boxSub pinkText">transfer.completed</text>
<text x="1420" y="238" class="boxSub pinkText">transfer.failed</text>
<text x="1420" y="258" class="boxSub pinkText" font-size="9.5">each with .retry + .dlt</text>

<line x1="1420" y1="278" x2="1670" y2="278" stroke="#993556" stroke-width="0.7" opacity="0.4"/>

<text x="1420" y="302" class="boxTitle pinkText" font-size="12">Partitioning</text>
<text x="1420" y="322" class="boxSub pinkText">Key = accountId</text>
<text x="1420" y="340" class="boxSub pinkText">Order per account,</text>
<text x="1420" y="356" class="boxSub pinkText">parallel across accounts</text>

<line x1="1420" y1="378" x2="1670" y2="378" stroke="#993556" stroke-width="0.7" opacity="0.4"/>

<text x="1420" y="402" class="boxTitle pinkText" font-size="12">Producers</text>
<text x="1420" y="422" class="boxSub pinkText">Outbox publishers</text>
<text x="1420" y="440" class="boxSub pinkText">(transaction, partner bank)</text>

<line x1="1420" y1="460" x2="1670" y2="460" stroke="#993556" stroke-width="0.7" opacity="0.4"/>

<text x="1420" y="484" class="boxTitle pinkText" font-size="12">Consumers</text>
<text x="1420" y="504" class="boxSub pinkText">Partner Bank</text>
<text x="1420" y="522" class="boxSub pinkText">Fraud, Notification, Audit</text>
<text x="1420" y="540" class="boxSub pinkText">Transaction (results)</text>

<line x1="1420" y1="560" x2="1670" y2="560" stroke="#993556" stroke-width="0.7" opacity="0.4"/>

<text x="1420" y="584" class="boxTitle pinkText" font-size="12">Consumer groups</text>
<text x="1420" y="604" class="boxSub pinkText">One group per service</text>
<text x="1420" y="622" class="boxSub pinkText">Manual ack after commit</text>

<line x1="1420" y1="642" x2="1670" y2="642" stroke="#993556" stroke-width="0.7" opacity="0.4"/>

<text x="1420" y="666" class="boxTitle pinkText" font-size="12">Retry / DLT</text>
<text x="1420" y="686" class="boxSub pinkText">Fast retries, then .retry</text>
<text x="1420" y="704" class="boxSub pinkText">topic, then .dlt for a human</text>

<!-- Legend -->
<text x="20" y="870" class="sectionLabel" fill="#444441">Legend</text>
<rect x="20" y="885" width="14" height="14" class="box teal"/><text x="40" y="897" class="boxSub" fill="#444441">Business service</text>
<rect x="180" y="885" width="14" height="14" class="box amber"/><text x="200" y="897" class="boxSub" fill="#444441">Cross-cutting</text>
<rect x="330" y="885" width="14" height="14" class="box coral"/><text x="350" y="897" class="boxSub" fill="#444441">Async / outbox</text>
<rect x="500" y="885" width="14" height="14" class="box green"/><text x="520" y="897" class="boxSub" fill="#444441">Data store</text>
<rect x="640" y="885" width="14" height="14" class="box gray"/><text x="660" y="897" class="boxSub" fill="#444441">Deployment</text>
<rect x="800" y="885" width="14" height="14" class="box pink"/><text x="820" y="897" class="boxSub" fill="#444441">Kafka</text>
<rect x="920" y="885" width="14" height="14" class="box blue"/><text x="940" y="897" class="boxSub" fill="#444441">Client</text>
<rect x="1040" y="885" width="14" height="14" class="box purple"/><text x="1060" y="897" class="boxSub" fill="#444441">Gateway</text>

<text x="20" y="930" class="boxSub" fill="#888780" font-size="10.5">Matches the README's Mermaid architecture diagram; see there for the request-by-request sequence.</text>
</svg>
