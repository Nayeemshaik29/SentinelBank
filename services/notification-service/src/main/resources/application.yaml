server:
  port: 8086

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:sentinelbank}?currentSchema=notification
    username: ${DB_USER:sentinel}
    password: ${DB_PASSWORD:sentinel}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks that it matches
    properties:
      hibernate.default_schema: notification
  flyway:
    schemas: notification
    default-schema: notification
    create-schemas: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # No business events of its own to publish; this producer exists only because
      # DeadLetterPublishingRecoverer (see config.KafkaConsumerConfig) needs one to move a failed message
      # on to its .retry / .dlt topic.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false   # the record is only acknowledged after our own processing commits
  # MailHog locally: it accepts any SMTP mail without auth or TLS and shows it at http://localhost:8025.
  mail:
    host: ${MAILHOG_HOST:localhost}
    port: ${MAILHOG_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"

sentinelbank:
  notification:
    from-address: ${NOTIFICATION_FROM_ADDRESS:notifications@sentinelbank.dev}
  services:
    # Resolving a transfer's recipient: fromAccountId -> ownerId (account-service), ownerId -> email
    # (auth-service). Both are the same /internal/** service-to-service pattern already used elsewhere.
    account: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
    auth: ${AUTH_SERVICE_URL:http://localhost:8081}
  kafka:
    retry:
      max-attempts: 3
      backoff-ms: 500
    retry-topic:
      max-attempts: 3
      backoff-ms: 3000

resilience4j:
  circuitbreaker:
    instances:
      account-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
      auth-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
  retry:
    instances:
      account-service:
        max-attempts: 3
        wait-duration: 200ms
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
      auth-service:
        max-attempts: 3
        wait-duration: 200ms
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
