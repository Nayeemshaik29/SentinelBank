server:
  port: 8082

spring:
  application:
    name: account-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:sentinelbank}?currentSchema=account
    username: ${DB_USER:sentinel}
    password: ${DB_PASSWORD:sentinel}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks that it matches
    properties:
      hibernate.default_schema: account
  flyway:
    schemas: account
    default-schema: account
    create-schemas: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"

sentinelbank:
  seed:
    # Creates two demo accounts for the seeded demo customer on first start. Local dev convenience only.
    enabled: ${SEED_DEMO_ACCOUNTS:true}
