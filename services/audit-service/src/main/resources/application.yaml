server:
  port: 8087

spring:
  application:
    name: audit-service
  # See fraud-service's application.yaml for the full story: Boot 4 renamed spring.data.mongodb.* to
  # spring.mongodb.* for connection settings (uri, representation.uuid, ...) — the old prefix is a hard,
  # silent no-op in Boot 4, not just discouraged, and getting it wrong doesn't fail startup, it just quietly
  # connects to the wrong place. Using the correct prefix from the start here.
  mongodb:
    uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/audit
    representation:
      uuid: standard
  data:
    mongodb:
      auto-index-creation: true   # lets @Indexed on the documents create its own indexes
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # No business events of its own to publish; this producer exists only because
      # DeadLetterPublishingRecoverer (see config.KafkaConsumerConfig) needs one to move a failed message
      # on to its .retry / .dlt topic.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: audit-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false   # the record is only acknowledged after our own processing commits

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"

sentinelbank:
  kafka:
    retry:
      max-attempts: 3
      backoff-ms: 500
    retry-topic:
      max-attempts: 3
      backoff-ms: 3000
