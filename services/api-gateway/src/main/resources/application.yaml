server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000     # ms to open a connection to a service
            response-timeout: 30s     # max wait for a service to answer

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [${spring.application.name}]"

sentinelbank:
  jwt:
    # Must be the same secret the auth-service signs with. Local dev default only: set JWT_SECRET elsewhere.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    issuer: sentinelbank
  services:
    auth: ${AUTH_SERVICE_URL:http://localhost:8081}
    account: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
    transaction: ${TRANSACTION_SERVICE_URL:http://localhost:8083}
    fraud: ${FRAUD_SERVICE_URL:http://localhost:8085}
    audit: ${AUDIT_SERVICE_URL:http://localhost:8087}
    ai-agent: ${AI_AGENT_SERVICE_URL:http://localhost:8088}
  rate-limit:
    general-per-minute: 120   # per user (or per IP when not logged in)
    auth-per-minute: 10       # per IP on login / register / refresh, to slow down password guessing
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
